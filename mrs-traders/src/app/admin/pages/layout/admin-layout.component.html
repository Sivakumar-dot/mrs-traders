<section
  class="min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(8,145,178,0.14),_transparent_24%),radial-gradient(circle_at_bottom_right,_rgba(15,23,42,0.08),_transparent_28%),linear-gradient(180deg,_#f8fafc_0%,_#eef2ff_100%)] px-4 py-6 text-slate-900 sm:px-6 lg:px-8"
>
  <div class="mx-auto flex min-h-[calc(100vh-3rem)] max-w-7xl flex-col gap-6 lg:flex-row">
    <aside
      class="w-full shrink-0 rounded-[2rem] border border-white/70 bg-white/90 p-6 shadow-[0_30px_80px_rgba(15,23,42,0.12)] backdrop-blur lg:sticky lg:top-6 lg:min-h-[calc(100vh-3rem)] lg:w-80"
    >
      <div class="flex items-start justify-between gap-4">
        <div>
          <span
            class="inline-flex rounded-full border border-cyan-200 bg-cyan-50 px-3 py-1 text-xs font-semibold uppercase tracking-[0.22em] text-cyan-700"
          >
            Admin Panel
          </span>
          <h1 class="mt-4 text-2xl font-semibold tracking-tight text-slate-950">
            Manage Website Content
          </h1>
          <p class="mt-2 text-sm leading-6 text-slate-500">
            Navigate between company details and future content modules from one place.
          </p>
        </div>
      </div>

      <nav class="mt-8 space-y-2">
        @for (item of navigationItems(); track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="border-cyan-200 bg-cyan-50 text-cyan-800 shadow-[0_14px_30px_rgba(8,145,178,0.12)]"
            [routerLinkActiveOptions]="{ exact: item.exact ?? true }"
            class="flex items-center rounded-2xl border border-transparent px-4 py-3 text-sm font-semibold text-slate-600 transition hover:border-slate-200 hover:bg-slate-50 hover:text-slate-900"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="mt-8 rounded-[1.5rem] border border-slate-200 bg-slate-50 p-4">
        <p class="text-sm font-semibold text-slate-900">Workspace</p>
        <p class="mt-1 text-sm leading-6 text-slate-500">
          The sections below are ready for gradual expansion without changing the admin shell.
        </p>
      </div>

      <button
        type="button"
        class="mt-8 inline-flex w-full items-center justify-center rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50"
        (click)="logout()"
      >
        Logout
      </button>
    </aside>

    <main class="min-w-0 flex-1">
      <router-outlet />
    </main>
  </div>
</section>
