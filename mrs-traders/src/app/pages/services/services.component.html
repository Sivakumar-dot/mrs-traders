<section class="mx-auto max-w-7xl px-4 py-20 sm:px-6 lg:px-8">
  <div class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <span class="section-kicker">SERVICES</span>
      <h1 class="section-title mt-4">Curated solutions for daily utility and modern living</h1>
    </div>
    <p class="max-w-2xl text-base leading-7 text-slate-300">
      From essential replacements to premium lighting upgrades, our selection is tailored for
      practical performance and a polished finish.
    </p>
  </div>

  <div class="mt-10 grid gap-6 lg:grid-cols-3">
    @for (service of services; track service.title) {
      <article
        class="group overflow-hidden rounded-[2rem] border border-white/10 bg-[var(--color-panel)] shadow-soft transition duration-500 hover:-translate-y-2 hover:border-[var(--color-accent)]/40"
      >
        <div class="overflow-hidden">
          <img
            class="h-64 w-full object-cover transition duration-700 group-hover:scale-105"
            [src]="service.image"
            [alt]="service.title"
          />
        </div>
        <div class="p-7">
          <h3 class="text-2xl font-semibold text-white">{{ service.title }}</h3>
          <p class="mt-4 text-base leading-7 text-slate-300">{{ service.description }}</p>
        </div>
      </article>
    }
  </div>
</section>
