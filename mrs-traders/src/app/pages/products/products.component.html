<section class="relative overflow-hidden py-20">
  <div class="absolute inset-0 bg-[linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.04))]"></div>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="text-center">
      <span class="section-kicker justify-center">PRODUCTS</span>
      <h1 class="section-title mt-4 mx-auto">Popular product categories for home and project needs</h1>
    </div>
    <div class="mt-10 grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
      @for (product of products; track product.title) {
        <article
          class="rounded-[1.8rem] border border-white/10 bg-[linear-gradient(160deg,rgba(14,31,63,0.95),rgba(9,24,52,0.82))] p-6 shadow-soft transition hover:-translate-y-1 hover:border-[var(--color-accent)]/35"
        >
          <div
            class="flex h-14 w-14 items-center justify-center rounded-2xl bg-[var(--color-accent)]/12 text-[var(--color-accent)]"
          >
            <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M5.5 8.5 12 3l6.5 5.5M5 21h14" />
            </svg>
          </div>
          <h3 class="mt-5 text-xl font-semibold text-white">{{ product.title }}</h3>
          <p class="mt-3 leading-7 text-slate-300">{{ product.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
